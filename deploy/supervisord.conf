[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# Control interface. Without these three sections supervisorctl cannot attach
# ("ini file does not include supervisorctl section"), so there is no way to ask
# a running container which programs are up or to restart one without recycling
# the whole container. That turned a crash-looped mcp-server into a silent 502.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface.make_main_rpcinterface

[program:backend]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level info
directory=/app
user=appuser
autostart=true
autorestart=true
startsecs=180
startretries=3
stopasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
startretries=3
stopasgroup=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mcp-server]
command=python -m turbo_ea_mcp --host 127.0.0.1 --port 8001
directory=/app/mcp-server
user=appuser
autostart=true
autorestart=true
startsecs=10
startretries=3
stopasgroup=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
