name: Deploy to Azure Container Apps

on:
  workflow_run:
    workflows: ["Publish Docker images to GHCR"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name backend \
              --resource-group turboea-rg \
              --image ghcr.io/vinkbram/turbo-ea/backend:latest

      - name: Deploy frontend
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name frontend \
              --resource-group turboea-rg \
              --image ghcr.io/vinkbram/turbo-ea/frontend:latest

      - name: Deploy nginx
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name nginx \
              --resource-group turboea-rg \
              --image ghcr.io/vinkbram/turbo-ea/nginx:latest
